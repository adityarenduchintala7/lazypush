<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>LeetSync</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>LeetSync</h1>
    <p class="muted">LeetCode → GitHub</p>

    <section>
      <h2>Current problem</h2>
      <div id="problem">Open a LeetCode problem.</div>
      <div id="language"></div>
    </section>

    <section>
      <h2>GitHub</h2>
      <label>
        Repository
        <input id="repo" placeholder="username/leetcode-solutions">
      </label>
      <button id="save">Save repository</button>
    </section>

    <section>
      <h2>Last captured</h2>
      <pre id="status">Nothing captured yet.</pre>
    </section>

    <button id="capture">Capture current solution</button>
  </main>
  <script src="popup.js"></script>
</body>
</html>
